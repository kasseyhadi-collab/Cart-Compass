kind = "web"
previewPath = "/"
title = "CartCompass"
version = "1.0.0"
id = "artifacts/cart-compass"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22147

[services.development]
run = "pnpm --filter @workspace/cart-compass run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cart-compass", "run", "build" ]
publicDir = "artifacts/cart-compass/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22147"
BASE_PATH = "/"
